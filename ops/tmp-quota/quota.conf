# /etc/systemd/system/tmp.mount.d/quota.conf
# One user filling the shared 15 GiB /tmp took every session down on 2026-10-05.
# Every non-root user gets 3 GiB by default; tmp-quota.service raises maxi to 9 GiB,
# so one user at its limit next to Maxi at theirs stays near 80%.
# tmpfs cannot enable quotas on remount; this applies at the next fresh mount (boot).
[Mount]
Options=defaults,noatime,mode=1777,usrquota,usrquota_block_hardlimit=3G
